# Local S3 via MinIO. Use with the base compose file:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d --build
#
# This overlay:
#   1) starts MinIO (+ creates BUCKET / TRASH_BUCKET / AUDIT_BUCKET from app .env)
#   2) points the API container at http://minio:9000 (not localhost)
# Bucket/region values are NOT overridden here — they come from dps3explorerapi/.env

services:
  minio:
    container_name: dps3explorer-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    container_name: dps3explorer-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: ./dps3explorerapi/.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BUCKET="$${BUCKET:-dpengineeringtesting}"
        TRASH_BUCKET="$${TRASH_BUCKET:-s3explorer}"
        AUDIT_BUCKET="$${AUDIT_BUCKET:-s3explorer}"
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb -p "local/$${BUCKET}" || true
        mc mb -p "local/$${TRASH_BUCKET}" || true
        mc mb -p "local/$${AUDIT_BUCKET}" || true
        exit 0

  api:
    environment:
      # Docker-network endpoint only. Buckets/region stay from env_file.
      # Keys optional here too — get_s3_client defaults to minioadmin when endpoint is set.
      S3_ENDPOINT_URL: http://minio:9000
      AWS_EC2_METADATA_DISABLED: "true"
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  minio_data:
