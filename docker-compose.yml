# Base stack (API + UI). Primary switch in dps3explorerapi/.env:
#   S3_ENDPOINT_URL empty → real AWS (same boto3 code; keys optional / IAM OK)
#   S3_ENDPOINT_URL set   → MinIO / LocalStack (MinIO keys default if unset)
#
# Local MinIO:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d --build
#
# Real AWS:
#   clear S3_ENDPOINT_URL in dps3explorerapi/.env, then:
#   docker compose up -d --build
#
# API on host + MinIO in Docker:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d minio minio-init
#   S3_ENDPOINT_URL=http://localhost:9000 (keys optional)

services:
  api:
    container_name: dps3explorer-api
    build:
      context: ./dps3explorerapi
    ports:
      - "8000:8000"
    env_file:
      - path: ./dps3explorerapi/.env
        required: false
    environment:
      APPROVAL_FRONTEND_URL: ${APPROVAL_FRONTEND_URL:-http://localhost:3000/explorer}
      APPROVAL_BASE_URL: ${APPROVAL_BASE_URL:-http://localhost:8000/api/v2/explorer}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v2/explorer/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ui:
    container_name: dps3explorer-ui
    build:
      context: ./dps3explorerui
      args:
        NEXT_PUBLIC_HOSTNAME: ${NEXT_PUBLIC_HOSTNAME:-http://localhost:8000/api/v2}
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
